<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>eMAG ПЦД скенер</title><style>body{font:16px system-ui;background:#f4f6f8;margin:0;color:#19212b}header{background:#152d45;color:white;padding:20px}main{padding:14px;max-width:900px;margin:auto}.sub{color:#607080}article{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 6px #ddd}a{color:#126ba8;overflow-wrap:anywhere}.num{font-weight:700;color:#087645}input{padding:12px;border:1px solid #aaa;border-radius:9px;width:94%;font-size:16px}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}small{color:#5b6570}button{padding:10px;border:0;background:#e2edf4;border-radius:8px}</style><header><h2>🔍 eMAG ПЦД ≥ 50%</h2><div>Автоматично намерени оферти от достъпните страници</div></header><main><p id="status">Зареждане…</p><input id="filter" placeholder="Търси продукт…"><p><a href="results.csv" download>⬇ Изтегли CSV</a> · <button id="refresh">Обнови</button></p><div id="items"></div></main><script>
let data=[];const safe=s=>String(s??'');const status=document.getElementById('status'),items=document.getElementById('items');const esc=s=>safe(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){const q=document.getElementById('filter').value.toLocaleLowerCase('bg');const filtered=data.filter(x=>x.name.toLocaleLowerCase('bg').includes(q));items.replaceChildren();for(const x of filtered){let el=document.createElement('article');let a=document.createElement('a');a.textContent=x.name;a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';let h=document.createElement('h3');h.append(a);el.append(h);let p=document.createElement('p');p.textContent=`ПЦД: ${x.pcd_eur.toFixed(2)} € | Цена: ${x.price_eur.toFixed(2)} €`;let b=document.createElement('div');b.className='num';b.textContent=`Разлика: ${x.difference_eur.toFixed(2)} € (${x.difference_percent.toFixed(1)}%)`;el.append(p,b);items.append(el)}if(!filtered.length)items.textContent='Няма намерени продукти по тези критерии.'}
async function load(){try{const r=await fetch('results.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const obj=await r.json();data=(obj.items||[]).sort((a,b)=>b.difference_percent-a.difference_percent);status.textContent=`Статус: ${obj.status} · Проверени: ${obj.checked} · Открити URL: ${obj.discovered_urls} · Резултати: ${data.length} · ${obj.updated_utc||''}`+(obj.errors?.length?' · Грешка: '+obj.errors[0]:'');draw()}catch(e){status.textContent='Няма достъпни резултати: '+e.message}}document.getElementById('filter').addEventListener('input',draw);document.getElementById('refresh').addEventListener('click',load);load();
</script></html>
